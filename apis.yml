apis:
- name: ReadMe API (v2)
  description: >-
    The current ReadMe API for managing your project programmatically — API keys,
    API definitions, reference/guides/custom pages, categories, branches, changelog
    entries, recipes, images, fonts, Owlbot AI, project metadata, and search. Uses
    Bearer-token auth and returns RFC 9457 application/problem+json errors.
  humanURL: https://docs.readme.com/main/reference/intro-to-the-readme-api
  baseURL: https://api.readme.com/v2
  tags:
  - Documentation
  - Developer Experience
  properties:
  - type: Documentation
    url: https://docs.readme.com/main/reference/intro-to-the-readme-api
  - type: APIReference
    url: https://docs.readme.com/main/reference
- name: Developer Metrics API
  description: >-
    Read-only analytics over your ReadMe developer hub — page views (total, unique,
    by day, by user, by path), best/worst/top pages, average page quality, top search
    terms, users by search term, and page comments/performance.
  humanURL: https://docs.readme.com/main/reference/developer-metrics-api
  baseURL: https://api.readme.com/v2
  tags:
  - Metrics
  - Analytics
  properties:
  - type: APIReference
    url: https://docs.readme.com/main/reference/metrics-api-introduction
- name: ReadMe API (v1, Legacy)
  description: >-
    The legacy ReadMe API (HTTP Basic auth with an API key) for docs, categories,
    versions, custom pages, changelog, API specification upload, the API registry,
    and search. Not available to projects using ReadMe Refactored; superseded by v2.
  humanURL: https://docs.readme.com/main/reference/legacy-api
  baseURL: https://dash.readme.com/api/v1
  tags:
  - Legacy
  properties:
  - type: APIReference
    url: https://docs.readme.com/main/reference/legacy-api
  - type: Deprecation
    url: https://docs.readme.com/main/reference/api-upgrade-guide
