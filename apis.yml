aid: readmeio
name: ReadMe.io
description: >-
  ReadMe is a developer-experience platform that turns an OpenAPI definition into
  interactive, personalized API documentation and developer hubs — complete with a
  live API Explorer ("Try It!"), guides, recipes, a changelog, discussions, and
  Developer Metrics that show how real users call your API. Teams manage their docs
  as code (Git-synced, branch-based via ReadMe Refactored) and programmatically through
  the ReadMe API. This profile catalogs ReadMe's own public APIs: the ReadMe API v2
  (Bearer-token, RFC 9457 errors), the Developer Metrics API, and the Legacy API v1.
